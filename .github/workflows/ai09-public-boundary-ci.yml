name: AI09 public boundary CI (no source or secrets)
on:
  pull_request:
    paths:
      - AGENTS.md
      - public_runner.py
      - requirements-public.txt
      - tests/test_public_runner.py
      - .github/workflows/ai09-public-boundary-ci.yml
      - .github/workflows/ai09-public-safe-pilot.yml
      - tests/test_public_workflow.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-public.txt
      - name: Verify confidentiality and reject tampered ciphertext
        run: python -m unittest discover -s tests -v

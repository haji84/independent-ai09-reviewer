name: AI09 public boundary CI (no source or secrets)
on:
  pull_request:
    paths:
      - AGENTS.md
      - public_runner.py
      - data_driver.py
      - context_probe.py
      - receipt_collection.py
      - source_archive.py
      - runtime_assets.py
      - confidential_capture.py
      - loopback_client.py
      - requirements-public.txt
      - tests/test_public_runner.py
      - .github/workflows/ai09-public-boundary-ci.yml
      - .github/workflows/ai09-public-safe-pilot.yml
      - tests/test_public_workflow.py
      - tools/sandbox_probe.py
      - tests/test_sandbox_probe.py
      - tests/fixtures/sandbox_guest.py
      - tools/data_driver_probe.py
      - tests/test_data_driver.py
      - tests/test_context_probe.py
      - tests/test_receipt_collection.py
      - tests/test_source_archive.py
      - tests/test_runtime_assets.py
      - tests/test_public_model_smoke.py
      - tools/public_model_smoke.py
      - tests/fixtures/model_guest.py
      - tests/test_data_driver_probe.py
      - tests/test_confidential_capture.py
      - tests/test_loopback_client.py
      - tests/fixtures/data_guest.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-public.txt
      - name: Verify confidentiality and reject tampered ciphertext
        run: python -m unittest discover -s tests -v
  synthetic-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-public.txt
      - name: Exercise PUBLIC synthetic isolation only; no private execution
        run: python3 -I tools/sandbox_probe.py
      - name: Capture, independently verify and seal PUBLIC fake-model bytes only
        run: python3 -I tools/data_driver_probe.py
      - name: Observe one real pinned local model call on PUBLIC toy input only
        run: python3 -I tools/public_model_smoke.py

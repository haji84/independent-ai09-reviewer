name: AI09 public boundary CI (no source or secrets)
on:
  pull_request:
    paths:
      - public_runner.py
      - tests/test_public_runner.py
      - .github/workflows/ai09-public-boundary-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --quiet cryptography==46.0.4
      - name: Verify confidentiality and reject tampered ciphertext
        run: python -m unittest discover -s tests -v

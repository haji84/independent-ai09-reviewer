name: AI09 Model Calibration Candidate
on:
  push:
    branches: [audit/remote-lite-1832]
    paths:
      - src/calibrate-model.mjs
      - .github/workflows/model-calibration.yml
permissions:
  contents: read
concurrency:
  group: independent-ai09-calibration
  cancel-in-progress: true
jobs:
  calibration:
    if: github.repository == 'haji84/independent-ai09-reviewer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Validate isolated runner and reviewer source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/calibrate-model.mjs
      - name: Install verified standalone Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C /usr
      - name: Start local Qwen2.5 Coder 7B
        shell: bash
        run: |
          set -euo pipefail
          ollama serve >"$RUNNER_TEMP/ai09-calibration-ollama.log" 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          timeout 600s ollama pull qwen2.5-coder:7b
      - name: Check actual model on synthetic known-bad code
        shell: bash
        run: node src/calibrate-model.mjs
      - name: Archive digest-only calibration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai09-model-calibration-proof
          path: model-calibration-proof.json
          retention-days: 3
          if-no-files-found: warn

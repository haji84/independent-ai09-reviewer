name: AI09 Reviewer Offline Security Tests
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  synthetic-validators-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: |
          node --check src/ai09-independent.mjs
          node --check src/review-schema.mjs
          node --check src/receipt-coverage.mjs
          node --check src/receipt-ledger.mjs
          node --test tests/review-schema.test.mjs tests/receipt-coverage.test.mjs tests/receipt-ledger.test.mjs

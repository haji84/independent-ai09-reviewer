name: Independent AI09 Candidate Proof
# Model execution is forbidden on unreviewed push. Dispatch requires
# separate reviewed installation on default branch and explicit owner gate.
on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: 'Immutable approved candidate SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: independent-ai09-candidate
  cancel-in-progress: true

jobs:
  reviewer-candidate:
    if: github.repository == 'haji84/independent-ai09-reviewer' && github.ref == 'refs/heads/main' && github.event.inputs.approved_head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AI09_BASE_SHA: 99d4e1568fa15c7cab48fc343cd5521c0f8c9512
      AI09_HEAD_SHA: ee2238cdbe0be218d7a2d47bad234c5f0836bf20
      # Historical 7B digest: fail closed if the model tag resolves differently.
      AI09_EXPECTED_MODEL_DIGEST: dae161e27b0e90dd1856c8bb3209201fd6736d8eb66298e75ed87571486f4364
      # No secret is created here. Provisioning requires a separate human gate.
      AI09_PRIVATE_FINDINGS_KEY_HEX: ${{ secrets.AI09_PRIVATE_FINDINGS_KEY_HEX }}
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - name: Checkout ONLY independent reviewer source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Reject unexpected runner and invalid JS
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = haji84/independent-ai09-reviewer
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/ai09-independent.mjs
      - name: Install SHA256-pinned Ollama on disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C /usr
      - name: Start loopback Ollama Qwen model
        shell: bash
        run: |
          set -euo pipefail
          ollama serve >"$RUNNER_TEMP/ai09-ollama.log" 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          timeout 600s ollama pull qwen2.5-coder:7b
      - name: Source-only independent model canary
        shell: bash
        run: node src/ai09-independent.mjs
      - name: Preserve digest-only evidence; not an approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai09-independent-candidate-proof
          path: |
            ai09-independent-proof.json
            ai09-private-findings.enc.json
          if-no-files-found: warn
          retention-days: 3
